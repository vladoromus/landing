<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Вибір шаблону</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Inter', sans-serif;

      background:
      linear-gradient(
      135deg,
      #0f172a,
      #111827,
      #1e293b);

      min-height:100vh;

      color:white;

      padding:60px 20px;
    }

    .container{

      max-width:1200px;
      margin:auto;
    }

    .top{

      text-align:center;

      margin-bottom:60px;
    }

    .top h1{

      font-size:64px;

      margin-bottom:20px;

      letter-spacing:-2px;
    }

    .top p{

      color:#94a3b8;

      font-size:18px;

      max-width:700px;

      margin:auto;

      line-height:1.8;
    }

    .grid{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(320px,1fr));

      gap:28px;
    }

    .card{

      background:
      linear-gradient(
      180deg,
      rgba(255,255,255,0.06),
      rgba(255,255,255,0.03));

      border:1px solid rgba(255,255,255,0.08);

      border-radius:30px;

      overflow:hidden;

      transition:0.35s;

      backdrop-filter:blur(12px);
    }

    .card:hover{

      transform:
      translateY(-8px);

      border-color:
      rgba(74,222,128,0.35);

      box-shadow:
      0 25px 50px rgba(0,0,0,0.35);
    }

    .preview{

      height:220px;

      position:relative;

      overflow:hidden;
    }

    /* TEMPLATE COLORS */

    .preview.one{

      background:
      linear-gradient(
      135deg,
      #1e293b,
      #0f172a);
    }

    .preview.two{

      background:
      linear-gradient(
      135deg,
      #f5efe6,
      #e7ddd0);
    }

    .preview.three{

      background:
      linear-gradient(
      135deg,
      #14213d,
      #1d3557);
    }

    .preview.four{

      background:
      linear-gradient(
      135deg,
      #111827,
      #0b1120);
    }

    .number{

      position:absolute;

      top:20px;
      left:20px;

      width:54px;
      height:54px;

      border-radius:18px;

      background:
      rgba(255,255,255,0.10);

      display:flex;
      align-items:center;
      justify-content:center;

      font-size:22px;
      font-weight:800;
    }

    .fake-ui{

      position:absolute;

      bottom:25px;
      left:25px;
      right:25px;

      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .line{

      height:16px;

      border-radius:999px;

      background:
      rgba(255,255,255,0.16);
    }

    .line.small{
      width:45%;
    }

    .line.medium{
      width:70%;
    }

    .line.large{
      width:100%;
    }

    .content{

      padding:30px;
    }

    .content h2{

      font-size:28px;

      margin-bottom:14px;
    }

    .content p{

      color:#9ca3af;

      line-height:1.8;

      margin-bottom:26px;
    }

    .buttons{

      display:flex;
      gap:14px;
      flex-wrap:wrap;
    }

    .btn{

      text-decoration:none;

      padding:14px 18px;

      border-radius:16px;

      font-weight:700;

      transition:0.3s;
    }

    .btn-open{

      background:
      linear-gradient(
      135deg,
      #4ade80,
      #22c55e);

      color:#08110c;
    }

    .btn-open:hover{

      transform:
      translateY(-2px);
    }

    .btn-number{

      background:
      rgba(255,255,255,0.05);

      border:1px solid rgba(255,255,255,0.08);

      color:white;
    }

    footer{

      margin-top:70px;

      text-align:center;

      color:#6b7280;

      font-size:14px;
    }

    @media(max-width:700px){

      .top h1{
        font-size:42px;
      }

      .top p{
        font-size:16px;
      }

    }

  </style>
</head>

<body>

    <div class="top">

      <h1>
        Вибір дизайну

    </div>

  </div>
